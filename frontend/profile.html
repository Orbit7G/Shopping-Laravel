<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجري | الملف الشخصي</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3 sticky-top shadow">
        <div class="container">
            <a class="navbar-brand mb-0 h1" href="index.html">🛒 Orbit Store</a>
            <div class="d-flex gap-2" id="auth-buttons">
                <!-- يتم تحديثه ديناميكياً -->
            </div>
        </div>
    </nav>

    <!-- Content -->
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card shadow-sm border-0 rounded-3 p-4 bg-white">
                    <h3 class="text-center fw-bold mb-4">تعديل الملف الشخصي</h3>

                    <div id="profileMessage"></div>

                    <form id="profileForm" enctype="multipart/form-data">
                        <!-- عرض الصورة الشخصية -->
                        <div class="text-center mb-4">
                            <img id="avatarPreview" src="https://via.placeholder.com/150" 
                                 class="rounded-circle shadow-sm border" 
                                 style="width: 130px; height: 130px; object-fit: cover;">
                            <div class="mt-2">
                                <label for="avatar" class="btn btn-sm btn-outline-primary">تغيير الصورة</label>
                                <input type="file" id="avatar" accept="image/*" class="d-none">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="prof_name" class="form-label fw-semibold">الاسم الكامل</label>
                            <input type="text" class="form-control" id="prof_name" required>
                        </div>

                        <div class="mb-3">
                            <label for="prof_email" class="form-label fw-semibold">البريد الإلكتروني</label>
                            <input type="email" class="form-control" id="prof_email" required>
                        </div>

                        <div class="mb-4">
                            <label for="prof_phone" class="form-label fw-semibold">رقم الهاتف</label>
                            <input type="tel" class="form-control" id="prof_phone" required>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary flex-grow-1 fw-bold">حفظ التعديلات</button>
                            <a href="index.html" class="btn btn-outline-secondary">إلغاء</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="assets/js/main.js"></script>
</body>
</html>
