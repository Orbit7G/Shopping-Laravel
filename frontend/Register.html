<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجري | إنشاء حساب جديد</title>
    <!-- Bootstrap RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3 sticky-top shadow">
        <div class="container">
            <a class="navbar-brand mb-0 h1" href="index.html">🛒 Orbit Store</a>
            <div class="d-flex gap-2" id="auth-buttons">
                <a href="login.html" class="btn btn-outline-light btn-sm">Login</a>
                <a href="Register.html" class="btn btn-primary btn-sm">Sign Up</a>
            </div>
        </div>
    </nav>

    <!-- Form Container -->
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm border-0 rounded-3 p-4 bg-white">
                    <h3 class="text-center fw-bold mb-4">إنشاء حساب جديد</h3>

                    <!-- رسائل التنبيه والخطأ -->
                    <div id="message"></div>

                    <form id="registerForm">
                        <div class="mb-3">
                            <label for="name" class="form-label fw-semibold">الاسم الكامل</label>
                            <input type="text" class="form-control" id="name" required placeholder="أدخل اسمك الكامل">
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">البريد الإلكتروني</label>
                            <input type="email" class="form-control" id="email" required placeholder="example@mail.com">
                        </div>

                        <div class="mb-3">
                            <label for="phone" class="form-label fw-semibold">رقم الهاتف</label>
                            <input type="tel" class="form-control" id="phone" required placeholder="05xxxxxxxx">
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">كلمة المرور</label>
                            <input type="password" class="form-control" id="password" required placeholder="••••••••">
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">تسجيل الحساب</button>
                    </form>

                    <div class="text-center mt-3">
                        <small class="text-muted">لديك حساب بالفعل؟ <a href="login.html" class="text-primary text-decoration-none fw-bold">تسجيل الدخول</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="assets/js/main.js"></script>
</body>
</html>
